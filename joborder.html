<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Luxury Invoice</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(120deg,#eef2ff,#dbeafe,#f5f3ff);margin:0;padding:15px}
.container{max-width:794px;width:100%;margin:auto;background:white;border-radius:20px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.1)}

.header{background:linear-gradient(120deg,#0f172a,#334155);color:white;padding:25px;border-radius:15px;display:flex;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px;gap:10px}
.header input{padding:8px;border-radius:8px;border:none;width:160px}
.company-header h2{margin:0;font-size:28px}
.company-header div{display:flex;align-items:center;margin-bottom:10px;gap:10px}
.company-header input{flex:1;min-width:200px}

.company{background:#f1f5f9;padding:15px;border-radius:12px;margin-bottom:20px}
.buyer-row{display:flex;align-items:center;margin-bottom:10px;gap:10px}
.buyer-row input{flex:1;padding:10px;border-radius:8px;border:1px solid #ddd}
.company input{padding:10px;border-radius:8px;border:1px solid #ddd;width:100%}

.table{width:100%;border-collapse:collapse}
th{background:#2f5fa3;color:white;padding:10px;border-right:1px solid #ffffff55}
th:last-child{border-right:none}
td{padding:10px;border:1px solid #cbd5e1;text-align:center}

.btn{background:linear-gradient(120deg,#0f172a,#334155);border:none;padding:10px 18px;border-radius:8px;color:white;cursor:pointer;margin-top:10px}
.preview-img{max-width:100px;border-radius:8px;margin-top:5px;display:none}
.img-wrap{position:relative;display:inline-block}
.remove-img{position:absolute;top:-8px;right:-8px;background:red;color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;display:none}
.img-wrap:hover .remove-img{display:block}

/* Hide delete X button until mouse hover */
#invoiceTable tbody td button{display:none}
#invoiceTable tbody tr:hover td button{display:inline-block}

.summary{margin-top:20px;width:100%;max-width:350px;margin-left:auto}
.summary div{display:flex;justify-content:space-between;padding:6px 0}
.summary input{width:100px;padding:5px;border:1px solid #ddd;border-radius:6px}
.grand{font-weight:700;font-size:18px;border-top:2px solid #000;margin-top:8px;padding-top:8px}

.notes{margin-top:25px;background:#f8fafc;padding:15px;border-radius:10px}
.table-wrapper{overflow-x:auto;width:100%}

@media print{
 body{background:white;margin:0;padding:0}
 .container{width:100% !important;max-width:100% !important;margin:0;padding:10mm;border-radius:0;box-shadow:none}
 .btn,input[type=file],.action-buttons{display:none !important}
 tr{page-break-inside:avoid}
}

@media(max-width:700px){
 body{padding:5px}
 .header{flex-direction:column}
 .header input{width:100%}
 .company{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container" id="invoice">

<div class="header">
<div class="company-header">
<div><b>Company Name :</b> <input type="text" placeholder="Company Name"></div>
<div><b>Address :</b> <input type="text" placeholder="Address"></div>
<div><b>Phone :</b> <input type="text" placeholder="Phone"></div>
</div>

<div>
Invoice No <input type="text" placeholder="INV-001"><br><br>
Invoice Date <input type="text" placeholder="DD/MM/YYYY">
</div>
</div>

<div class="company">

<div class="buyer-row">
<b>Buyers Details :</b>
<input type="text" placeholder="Client Name">
</div>

<div class="buyer-row">
<b>Address :</b>
<input type="text" placeholder="Client Address">
</div>

<div class="buyer-row">
<b>Phone :</b>
<input type="text" placeholder="Client Phone">
</div>

</div>

<div class="table-wrapper">
<table class="table" id="invoiceTable">
<thead>
<tr>
<th>S.N</th>
<th>Description</th>
<th>Size</th>
<th>Qty</th>
<th>Rate</th>
<th>Amount</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>



<div class="summary">
<div>Subtotal <span>Rs <span id="subtotal">0</span></span></div>
<div>Tax (%) <input type="number" id="tax" value="0" oninput="calcTotal()"></div>
<div>Discount <input type="number" id="discount" value="0" oninput="calcTotal()"></div>
<div class="grand">Grand Total <span>Rs <span id="grand">0</span></span></div>
</div>

<div class="notes" contenteditable="true">
<b>Notes</b>
<ul>
<li>Payment due within 7 days</li>
<li>Goods once sold will not be returned</li>
</ul>
</div>

</div>

<div style="text-align:center;margin-top:25px;font-weight:600;font-size:18px">Thank You For Doing Business With Us</div>

<!-- ACTION BUTTONS -->
<div class="action-buttons" style="margin-top:15px;text-align:center">
<button class="btn" onclick="addRow()">+ Add Item</button>
<button class="btn" onclick="removeSelectedRow()">Remove Row</button>
<button class="btn" onclick="downloadPDF()">Download PDF</button>
<button class="btn" onclick="printInvoice()">Print</button>
<button class="btn" onclick="shareInvoice()">Share</button>
<button class="btn" onclick="savePhoto()">Save as Photo (JPG)</button>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
let sn=1;

// auto add first row so Add Item always works visibly
window.onload=function(){ if(document.querySelector('#invoiceTable tbody').rows.length===0) addRow(); }
let historyStack=[];

function saveState(){
  historyStack.push(document.querySelector('#invoiceTable tbody').innerHTML);
  if(historyStack.length>50) historyStack.shift();
}

function undo(){
  if(historyStack.length>0){
    document.querySelector('#invoiceTable tbody').innerHTML = historyStack.pop();
    calcTotal();
  }
}

document.addEventListener('keydown',function(e){
  if(e.ctrlKey && e.key==='z'){
    e.preventDefault();
    undo();
  }
});

let selectedRow=null;

function addRow(){
  saveState();
  let t=document.querySelector('#invoiceTable tbody');
  let r=t.insertRow();
  r.innerHTML=`
  <td></td>
  <td contenteditable></td>
  <td contenteditable></td>
  <td contenteditable oninput='calc(this)'></td>
  <td contenteditable oninput='calc(this)'></td>
  <td></td>`;

  // click to select row
  r.onclick=function(){
    document.querySelectorAll('#invoiceTable tbody tr').forEach(tr=>tr.style.background='');
    this.style.background='#dbeafe';
    selectedRow=this;
  };

  renumberRows();
}

function removeSelectedRow(){
  if(!selectedRow) return alert('Please select a row');
  saveState();
  selectedRow.remove();
  selectedRow=null;
  renumberRows();
  calcTotal();
}

function renumberRows(){
  let rows=document.querySelectorAll('#invoiceTable tbody tr');
  rows.forEach((row,index)=>{
    row.cells[0].innerText=index+1;
  });
}


function calc(el){
  let r=el.parentElement;
  let q=parseFloat(r.cells[3].innerText)||0;
  let rate=parseFloat(r.cells[4].innerText)||0;
  r.cells[5].innerText=(q*rate)||'';
  calcTotal();
}

function calcTotal(){
  let sum=0;
  document.querySelectorAll('#invoiceTable tbody tr').forEach(r=>sum+=Number(r.cells[5].innerText)||0);
  document.getElementById('subtotal').innerText=sum;
  let tax=parseFloat(document.getElementById('tax').value)||0;
  let discount=parseFloat(document.getElementById('discount').value)||0;
  let grand=sum + (sum*tax/100) - discount;
  document.getElementById('grand').innerText=grand;
}

function downloadPDF(){
const element=document.getElementById('invoice');
html2pdf().set({
margin:[10,10,10,10],
filename:'Invoice.pdf',
html2canvas:{scale:3,backgroundColor:'#ffffff',useCORS:true,scrollY:0},
jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
}).from(element).save();
}

function printInvoice(){window.print();}

function shareInvoice(){
html2canvas(document.getElementById('invoice'),{scale:3,backgroundColor:'#ffffff',useCORS:true,scrollY:0}).then(canvas=>{
canvas.toBlob(async blob=>{
const file=new File([blob],'invoice.jpg',{type:'image/jpeg'});
if(navigator.share){
try{await navigator.share({files:[file],title:'Invoice',text:'Invoice'});}catch(e){alert('Share not supported in this browser');}
}else{
let link=document.createElement('a');
link.download='invoice.jpg';
link.href=canvas.toDataURL('image/jpeg',1.0);
link.click();
}
});
});
}

function savePhoto(){
window.scrollTo(0,0);
html2canvas(document.getElementById('invoice'),{
  scale:4,
  backgroundColor:'#ffffff',
  useCORS:true,
  scrollY:0,
  width:document.getElementById('invoice').scrollWidth,
  height:document.getElementById('invoice').scrollHeight
}).then(canvas=>{
  let link=document.createElement('a');
  link.download='invoice-photo.jpg';
  link.href=canvas.toDataURL('image/jpeg',1.0);
  link.click();
});
});
}
</script>
</body>
</html>
