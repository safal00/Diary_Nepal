<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Ledger System - Multi-User Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #334155; }
        .sidebar-bg { background-color: #1d4ed8; }
        .card-shadow { box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.02); }
        .sidebar-item-active { background-color: #ffffff; color: #1d4ed8; }
    </style>
</head>
<body class="flex min-h-screen text-slate-700">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-50 hidden bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl text-xs font-semibold flex items-center gap-2">
        <i class="fa-solid fa-circle-info text-blue-400"></i>
        <span id="toastMsg">Notification</span>
    </div>

    <!-- AUTHENTICATION MODAL (Generic Multi-User Login Portal) -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 border border-slate-100">
            
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-xl font-bold mb-3 shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 id="modalTitle" class="text-2xl font-bold text-slate-900">Welcome Back</h2>
                <p id="modalSub" class="text-slate-400 text-xs mt-1">Sign in to access your business ledger portal</p>
            </div>

            <!-- 1. GENERIC LOGIN FORM -->
            <form id="loginForm" onsubmit="handleEmailLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Gmail / Email</label>
                    <input type="email" id="loginEmail" placeholder="name@domain.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div class="flex justify-between items-center text-xs">
                    <label class="flex items-center gap-2 text-slate-500 cursor-pointer">
                        <input type="checkbox" checked class="rounded text-blue-600"> Remember multi-device
                    </label>
                    <button type="button" onclick="switchAuthView('forgot')" class="text-blue-600 font-bold hover:underline">Forgot Password?</button>
                </div>
                <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-lg shadow-blue-500/25 text-xs">Sign In</button>
                
                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink mx-3 text-[10px] text-slate-400 font-bold">OR</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <button type="button" onclick="handleGoogleLogin()" class="w-full py-3 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold rounded-xl text-xs flex items-center justify-center gap-2 shadow-sm">
                    <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    Sign in with Google
                </button>

                <p class="text-center text-xs text-slate-500 mt-3">Don't have an account? <button type="button" onclick="switchAuthView('register')" class="text-blue-600 font-bold hover:underline">Register</button></p>
            </form>

            <!-- 2. GENERIC REGISTER FORM -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Full Name / Business Name</label>
                    <input type="text" id="regName" placeholder="Your Name or Company" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Gmail / Email</label>
                    <input type="email" id="regEmail" placeholder="user@domain.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
                    <input type="password" id="regPassword" minlength="6" placeholder="Min 6 characters" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-lg text-xs">Create Account & Send Verification</button>
                <p class="text-center text-xs text-slate-500 mt-2"><button type="button" onclick="switchAuthView('login')" class="text-blue-600 font-bold hover:underline">Back to Login</button></p>
            </form>

            <!-- 3. GENERIC FORGOT PASSWORD FORM -->
            <form id="forgotForm" onsubmit="handleForgotPassword(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Registered Email</label>
                    <input type="email" id="forgotEmail" placeholder="user@domain.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <button type="submit" class="w-full py-3.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl transition shadow-lg text-xs">Send Reset Link/Code</button>
                <p class="text-center text-xs text-slate-500 mt-2"><button type="button" onclick="switchAuthView('login')" class="text-blue-600 font-bold hover:underline">Back to Login</button></p>
            </form>

        </div>
    </div>

    <!-- LEFT SIDEBAR -->
    <aside class="w-64 sidebar-bg text-white flex flex-col justify-between shrink-0 p-5">
        <div>
            <div class="flex items-center gap-3 px-2 py-3 mb-8">
                <div class="w-10 h-10 bg-white text-blue-600 rounded-2xl flex items-center justify-center font-bold text-xl shadow-md">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg leading-tight">Ledger Book</h1>
                    <span class="text-[11px] text-blue-200 font-medium">Cloud Workspace</span>
                </div>
            </div>

            <div class="text-[10px] font-bold text-blue-200/80 uppercase tracking-wider px-3 mb-3">Main Menu</div>
            <nav class="space-y-1.5 font-medium text-xs">
                <a href="#dashboard" onclick="switchTab('dashboard')" id="nav-dashboard" class="sidebar-item sidebar-item-active flex items-center gap-3.5 px-4 py-3 rounded-2xl font-bold transition">
                    <i class="fa-solid fa-border-all text-base w-5"></i> Dashboard
                </a>
                <a href="#customers" onclick="switchTab('customers')" id="nav-customers" class="sidebar-item flex items-center gap-3.5 px-4 py-3 rounded-2xl text-blue-100 hover:bg-blue-600/50 transition">
                    <i class="fa-solid fa-users text-base w-5"></i> Customers
                </a>
                <a href="#ledger" onclick="switchTab('ledger')" id="nav-ledger" class="sidebar-item flex items-center gap-3.5 px-4 py-3 rounded-2xl text-blue-100 hover:bg-blue-600/50 transition">
                    <i class="fa-solid fa-book text-base w-5"></i> Ledger
                </a>
            </nav>
        </div>

        <div class="bg-blue-600/60 p-3 rounded-2xl flex items-center justify-between border border-blue-400/20">
            <div class="flex items-center gap-3 overflow-hidden">
                <div id="userAvatar" class="w-9 h-9 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center font-bold text-sm shrink-0">U</div>
                <div class="truncate text-xs">
                    <div id="userNameDisplay" class="font-bold text-white truncate">User Account</div>
                    <div id="userEmailDisplay" class="text-blue-200 text-[10px] truncate">user@domain.com</div>
                </div>
            </div>
            <button onclick="handleLogout()" class="text-blue-200 hover:text-white ms-2 text-sm" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </aside>

    <!-- RIGHT MAIN CONTENT PANEL -->
    <main class="flex-1 overflow-y-auto px-8 py-6 space-y-6">
        <header class="flex justify-between items-center">
            <div>
                <span class="text-xs font-semibold text-slate-400">Overview</span>
                <h2 class="text-2xl font-bold text-slate-900" id="pageTitle">Dashboard</h2>
            </div>
            <div id="headerUserInitials" class="w-9 h-9 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold text-xs shadow-md">
                US
            </div>
        </header>

        <div>
            <h3 class="text-xl font-bold text-slate-900">Welcome back, <span id="welcomeUserName" class="text-blue-600">User</span> 👋</h3>
            <p class="text-xs text-slate-400 mt-0.5">Your ledger system dashboard is ready.</p>
        </div>
    </main>

    <script>
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        function switchAuthView(view) {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('forgotForm').classList.add('hidden');
            
            if (view === 'login') {
                document.getElementById('modalTitle').innerText = "Welcome Back";
                document.getElementById('loginForm').classList.remove('hidden');
            } else if (view === 'register') {
                document.getElementById('modalTitle').innerText = "Create Account";
                document.getElementById('registerForm').classList.remove('hidden');
            } else if (view === 'forgot') {
                document.getElementById('modalTitle').innerText = "Reset Password";
                document.getElementById('forgotForm').classList.remove('hidden');
            }
        }

        function loginUser(name, email) {
            document.getElementById('userNameDisplay').innerText = name;
            document.getElementById('welcomeUserName').innerText = name;
            document.getElementById('userEmailDisplay').innerText = email;
            document.getElementById('userAvatar').innerText = name[0].toUpperCase();
            document.getElementById('headerUserInitials').innerText = name.substring(0,2).toUpperCase();
            document.getElementById('authModal').classList.add('hidden');
            showToast("Login Successful!");
        }

        function handleEmailLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const name = email.split('@')[0];
            loginUser(name, email);
        }

        function handleGoogleLogin() {
            loginUser("Google User", "user@gmail.com");
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            showToast("Account Created! Verification email sent.");
            loginUser(name, email);
        }

        function handleForgotPassword(e) {
            e.preventDefault();
            showToast("Password reset link sent!");
            switchAuthView('login');
        }

        function handleLogout() {
            document.getElementById('authModal').classList.remove('hidden');
            showToast("Logged out successfully.");
        }
    </script>
</body>
</html>
